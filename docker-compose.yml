version: '3.9'

services:
  php:
    build:
      context: .
      dockerfile: ./docker/php.Dockerfile
    container_name: php
    restart: always
    volumes:
      - /media/md127/biotronica/html:/var/www/html
      - /media/md127/biotronica/html/sessions:/var/www/html/sessions
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.php"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nestjs-todo-network

  todo-playground-server:
    build:
      context: .
      dockerfile: ./docker/node.Dockerfile
    image: todo-playground-server
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongo
      - redis-db
    networks:
      - nestjs-todo-network
    command: ["./wait-for.sh", "npm", "run", "start:dev"]

  mongo:
    image: arm64v8/mongo:6.0
    #container_name: mongo
    restart: always
    ports:
      - "27016:27017"
    networks:
      - nestjs-todo-network

  redis-db:
    image: arm64v8/redis:7.0
    #container_name: redis-db
    restart: always
    ports:
      - "6379:6379"
    networks:
      - nestjs-todo-network

  code-server:
      build:
        context: .
        dockerfile: ./docker/vscode.Dockerfile
      image: codercom/code-server:latest
      container_name: vscode-web
      command: >
        code-server
        --bind-addr 0.0.0.0:8080
        --auth password
        --proxy-domain biotronica.duckdns.org
      ports:
        - "8443:8080"
      environment:
        - PASSWORD=${CODESERVER_PASSWORD}
      volumes:
        - .:/home/coder/project
        - /media/md127/biotronica/html:/home/coder/html
        - /media/md127/biotronica/code-server-data:/home/coder/.local/share/code-server
      working_dir: /home/coder/project
      networks:
        - nestjs-todo-network

networks:
  nestjs-todo-network:
    name: nestjs-todo-network
    external: true
